apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-datasource
  namespace: agrosolutions
data:
  prometheus.yml: |
    apiVersion: 1
    
    datasources:
      - name: Prometheus
        type: prometheus
        access: proxy
        url: http://prometheus-service:9090
        uid: prometheus
        isDefault: true
        editable: false
        jsonData:
          timeInterval: "5s"
          queryTimeout: "60s"
