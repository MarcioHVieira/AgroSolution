apiVersion: apps/v1
kind: Deployment
metadata:
  name: agrosolutions-identidade
  namespace: agrosolutions
  labels:
    app: identidade
    version: v1
spec:
  replicas: 2
  selector:
    matchLabels:
      app: identidade
  template:
    metadata:
      labels:
        app: identidade
        version: v1
    spec:
      containers:
      - name: identidade
        image: <ACR_NAME>.azurecr.io/agrosolutions-identidade:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 8080
          name: http
          protocol: TCP
        - containerPort: 8081
          name: https
          protocol: TCP
        env:
        - name: ASPNETCORE_ENVIRONMENT
          value: "Production"
        - name: ASPNETCORE_URLS
          value: "http://+:8080"
        - name: ConnectionStrings__DefaultConnection
          valueFrom:
            secretKeyRef:
              name: agrosolutions-secrets
              key: sql-connection-string
        - name: Jwt__ChaveSecreta
          valueFrom:
            secretKeyRef:
              name: agrosolutions-secrets
              key: jwt-secret
        - name: RabbitMQ__HostName
          value: "rabbitmq-service"
        - name: RabbitMQ__UserName
          valueFrom:
            secretKeyRef:
              name: agrosolutions-secrets
              key: rabbitmq-username
        - name: RabbitMQ__Password
          valueFrom:
            secretKeyRef:
              name: agrosolutions-secrets
              key: rabbitmq-password
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: identidade-service
  namespace: agrosolutions
  labels:
    app: identidade
spec:
  type: ClusterIP
  ports:
  - port: 80
    targetPort: 8080
    protocol: TCP
    name: http
  selector:
    app: identidade
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: identidade-hpa
  namespace: agrosolutions
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: agrosolutions-identidade
  minReplicas: 2
  maxReplicas: 10
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80
