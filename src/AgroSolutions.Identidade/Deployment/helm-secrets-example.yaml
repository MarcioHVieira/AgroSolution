# ATENÇÃO: Este é apenas um EXEMPLO
# NÃO commitar este arquivo com valores reais!
# 
# Para criar o secret no Kubernetes:
# kubectl create secret generic agrosolutions-identidade-secrets \
#   --from-literal=ConnectionStrings__DefaultConnection='Server=...' \
#   --from-literal=Jwt__ChaveSecreta='sua-chave-secreta-minimo-32-caracteres' \
#   --from-literal=EmailSettings__SmtpServer='smtp.gmail.com' \
#   --from-literal=EmailSettings__SmtpUser='email@example.com' \
#   --from-literal=EmailSettings__SmtpPassword='senha-app' \
#   --from-literal=EmailSettings__FromEmail='email@example.com' \
#   --from-literal=RabbitMQ__HostName='rabbitmq.default.svc.cluster.local' \
#   --from-literal=RabbitMQ__UserName='admin' \
#   --from-literal=RabbitMQ__Password='senha-rabbitmq'

apiVersion: v1
kind: Secret
metadata:
  name: agrosolutions-identidade-secrets
  namespace: default
type: Opaque
stringData:
  # Connection String
  ConnectionStrings__DefaultConnection: ""
  
  # JWT (ChaveSecreta deve ter no mínimo 32 caracteres)
  JwtSettings__ChaveSecreta: ""
  
  # Email Settings
  EmailSettings__SmtpServer: ""
  EmailSettings__SmtpUser: ""
  EmailSettings__SmtpPassword: ""
  EmailSettings__FromEmail: ""
  
  # RabbitMQ
  RabbitMQ__HostName: ""
  RabbitMQ__UserName: ""
  RabbitMQ__Password: ""

